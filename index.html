<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Playlist Board</title>
<style>
:root{--bg:#0b0c0f;--card:#171a21;--card2:#1f232c;--line:#2a2f3a;--text:#e8eaf0;--muted:#8b93a5;--acc:#1ed760;--danger:#ff5d6c;--iz:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

/* ---- поле ---- */
#vp{position:fixed;inset:0;overflow:hidden;overflow:clip;touch-action:none;cursor:grab}
#vp.paint{cursor:crosshair}
#world{position:absolute;left:0;top:0;width:3200px;height:2200px;transform-origin:0 0;background-color:#0e1014;background-image:radial-gradient(#262a34 1.3px,transparent 1.3px);background-size:30px 30px;outline:1px solid #262a34}
#draw{position:absolute;left:0;top:0;width:3200px;height:2200px;pointer-events:none;z-index:900000}
.pov{position:absolute;inset:0;z-index:5;touch-action:none;display:none}
#vp.paint .pov{display:block}

/* ---- блоки ---- */
.blk{position:absolute;touch-action:none}
.blk .in{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px #0009}
.blk.sel .in{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 10px 30px #0009}
.blk.cover .in{border-radius:6px;background:#000;border:0}
.blk.cover img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
.bh{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;min-height:54px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;border-bottom:1px solid var(--line);flex:none}
.bh .ti{flex:1;min-width:0}
.bh .ti b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh .ti span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;padding:0;font-size:16px;line-height:1}
.ib:hover{border-color:#3b4252}
.ib.hl{border-color:var(--acc);color:var(--acc)}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 12px;font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04120a;font-weight:600}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#1a0508}
.lnk{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 4px;font-size:13px}
.scroll{overflow:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

.rs,.rot,.cx{display:none;position:absolute;border-radius:50%;background:var(--acc);color:#04120a;place-items:center;font-weight:700;touch-action:none;border:2px solid #0b0c0f;line-height:1;user-select:none}
.blk.sel .rs,.blk.sel .rot{display:grid}
.blk.sel.cover .cx{display:grid}
.blk.col .rs{display:none!important}
.rs{width:calc(30px*var(--iz));height:calc(30px*var(--iz));right:calc(-15px*var(--iz));bottom:calc(-15px*var(--iz));font-size:calc(15px*var(--iz));cursor:nwse-resize}
.rot{width:calc(30px*var(--iz));height:calc(30px*var(--iz));top:calc(-50px*var(--iz));left:calc(50% - 15px*var(--iz));font-size:calc(16px*var(--iz));cursor:grab}
.rot::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:calc(20px*var(--iz));background:var(--acc);transform:translateX(-50%)}
.cx{width:calc(28px*var(--iz));height:calc(28px*var(--iz));top:calc(-14px*var(--iz));right:calc(-14px*var(--iz));background:var(--danger);font-size:calc(14px*var(--iz));cursor:pointer}

/* альбом */
.ab{display:flex;flex-direction:column;flex:1;min-height:0}
.ar{display:flex;gap:6px;align-items:center;padding:8px 10px;flex:none;flex-wrap:wrap}
.tl{list-style:none;margin:0;padding:0 6px 8px;flex:1;min-height:0}
.tl label{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid #20242d;cursor:pointer}
.tl input{accent-color:var(--acc);width:18px;height:18px;flex:none;margin:0}
.tl .n{color:var(--muted);width:22px;text-align:right;font-size:12px;flex:none}
.tl .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .tt.off{opacity:.4;text-decoration:line-through}
.tl .d{color:var(--muted);font-size:12px;flex:none}

/* плейлист */
.pl{list-style:none;margin:0;padding:6px;counter-reset:n;flex:1;min-height:0}
.pl li{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px;background:var(--card2);margin-bottom:6px;counter-increment:n}
.pl li::before{content:counter(n);color:var(--muted);font-size:12px;width:20px;text-align:right;flex:none}
.pl li.drag{opacity:.75;outline:1px dashed var(--acc)}
.pl li.empty{display:block;background:none;color:var(--muted);font-size:14px;padding:10px;counter-increment:none}
.pl li.empty::before{content:none}
.grip{touch-action:none;cursor:grab;color:var(--muted);padding:8px 4px;font-size:16px;flex:none;user-select:none;line-height:1}
.pl img,.ph{width:36px;height:36px;border-radius:6px;object-fit:cover;flex:none;background:#262b36;display:grid;place-items:center;color:var(--muted)}
.pl .rt{flex:1;min-width:0}
.pl .rt b,.pl .rt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .rt span{color:var(--muted);font-size:12px}
.pf{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.nm{background:transparent;border:0;outline:0;font-weight:600;font-size:16px;min-width:0;flex:1;width:100%;padding:4px 0;user-select:text;-webkit-user-select:text}

/* поиск */
.top{position:fixed;z-index:50;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(580px,calc(100vw - 20px))}
.bar{display:flex;align-items:center;gap:8px;background:#16181ef2;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 16px;height:48px}
.bar svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.bar input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:16px;height:100%}
.bar button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:18px;flex:none}
.dd{margin-top:8px;background:#14161cf7;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;max-height:min(62vh,560px);overflow:auto;touch-action:pan-y;overscroll-behavior:contain;padding:6px}
.dd[hidden]{display:none}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 8px 4px}
.r{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;cursor:pointer}
.r:hover,.r:active{background:var(--card2)}
.r img,.r .ph{width:48px;height:48px;border-radius:6px;object-fit:cover;flex:none;background:#262b36}
.r .t{flex:1;min-width:0}
.r .t b,.r .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .t span{color:var(--muted);font-size:13px}
.r .go{flex:none;width:34px;height:34px;border-radius:50%;background:var(--acc);color:#04120a;display:grid;place-items:center;font-weight:700;font-size:18px}
.msg{padding:10px 8px;color:var(--muted);font-size:14px}
.msg.err{color:#ff8a95}
.msg small{display:block;opacity:.75;margin-top:6px;word-break:break-word;color:var(--muted)}

/* панель */
.tb{position:fixed;z-index:50;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100vw - 16px);display:flex;gap:6px;align-items:center;padding:8px;background:#16181ef2;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;overflow-x:auto;scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tbn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--text);padding:0;font-size:22px;line-height:1}
.tbn.on{background:#2a2f3a;border-color:#3b4252}
.tbn.armed{background:var(--danger);color:#1a0508}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;height:24px;background:var(--line);flex:none;margin:0 2px}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px #ffffff30}
.dot.on{border-color:#fff;transform:scale(1.15)}
.sz i{display:block;border-radius:50%;background:currentColor}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--acc);color:#04120a;padding:9px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
@media(max-width:560px){
  .tb{flex-wrap:wrap;justify-content:center;border-radius:26px;width:calc(100vw - 16px);overflow:visible;gap:4px 6px;padding:8px 6px}
  .tbn{width:36px;height:36px}
  .sep{display:none}
  .toast{bottom:calc(134px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="vp">
  <div id="world"><canvas id="draw" width="3200" height="2200"></canvas></div>
  <div class="pov" id="pov"></div>
</div>

<div class="top">
  <div class="bar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="text" placeholder="Поиск: альбом, песня, артист…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button id="qx" title="Очистить">✕</button>
  </div>
  <div class="dd" id="dd" hidden></div>
</div>

<div class="tb" id="tb"></div>
<div class="toast" id="toast"></div>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const fmtDur=s=>s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'';

const vp=$('#vp'), world=$('#world'), cv=$('#draw'), ctx=cv.getContext('2d');
const q=$('#q'), dd=$('#dd'), tb=$('#tb');
const WW=3200, WH=2200, COLH=54, KEY='plboard-v2';
const COLORS=['#ffffff','#111111','#ff3b3b','#ffb02e','#1ed760','#2f8bff','#a24bff'];
const SIZES=[4,8,16,28];
const FM=[['at','Artist - Title'],['ta','Title - Artist'],['t','Только название']];

const S={blocks:[],pl:{name:'Мой плейлист',fmt:'at',tracks:[]},strokes:[],view:{x:0,y:0,z:1},tool:'hand',color:'#ffffff',size:8,zc:10,sel:null,backup:null};
const els=new Map();
const pointers=new Map();
let drag=null, cur=null;

/* ================= сохранение ================= */
let st;
function saveSoon(){clearTimeout(st);st=setTimeout(save,300);}
function save(){
  const base={blocks:S.blocks,pl:S.pl,view:S.view,color:S.color,size:S.size};
  try{localStorage.setItem(KEY,JSON.stringify(Object.assign({strokes:S.strokes},base)));}
  catch(e){try{localStorage.setItem(KEY,JSON.stringify(Object.assign({strokes:[]},base)));}catch(_){}}
}
function validBlock(b){return b&&typeof b==='object'&&b.id&&['pl','album','cover'].includes(b.type)&&[b.x,b.y,b.w,b.h].every(Number.isFinite);}
let hadView=false;
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(d&&Array.isArray(d.blocks)){
      S.blocks=d.blocks.filter(validBlock);
      if(d.pl&&Array.isArray(d.pl.tracks)) S.pl=Object.assign(S.pl,d.pl);
      if(Array.isArray(d.strokes)) S.strokes=d.strokes;
      if(d.view&&[d.view.x,d.view.y,d.view.z].every(Number.isFinite)){S.view=d.view;hadView=true;}
      if(typeof d.color==='string') S.color=d.color;
      if(SIZES.includes(d.size)) S.size=d.size;
    }
  }catch(e){}
  S.zc=Math.max(10,...S.blocks.map(b=>b.z||0))+1;
}

/* ================= вид (панорама / зум) ================= */
function applyView(){const v=S.view;world.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`;world.style.setProperty('--iz',(1/v.z).toFixed(3));}
function clampView(){const v=S.view,W=vp.clientWidth,H=vp.clientHeight;const mx=140,my=140;v.x=clamp(v.x,Math.min(mx,W-WW*v.z-140),mx);v.y=clamp(v.y,Math.min(my,H-WH*v.z-140),my);}
function zoomAt(cx,cy,nz){const v=S.view;nz=clamp(nz,.25,2.5);const k=nz/v.z;v.x=cx-(cx-v.x)*k;v.y=cy-(cy-v.y)*k;v.z=nz;clampView();applyView();saveSoon();}
function fitView(){
  if(!S.blocks.length){S.view={x:0,y:0,z:clamp(innerWidth/640,.7,1)};applyView();return;}
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for(const b of S.blocks){
    const a=(b.rot||0)*Math.PI/180,c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a));
    const ex=(b.w*c+b.h*s)/2,ey=(b.w*s+b.h*c)/2,cx=b.x+b.w/2,cy=b.y+b.h/2;
    x1=Math.min(x1,cx-ex);y1=Math.min(y1,cy-ey);x2=Math.max(x2,cx+ex);y2=Math.max(y2,cy+ey);
  }
  const W=vp.clientWidth,H=vp.clientHeight,pw=x2-x1+120,ph=y2-y1+220;
  const z=clamp(Math.min(W/pw,H/ph),.25,1.2);
  S.view={z,x:W/2-(x1+x2)/2*z,y:H/2-(y1+y2)/2*z+10};
  clampView();applyView();saveSoon();
}
const toWorld=e=>({x:(e.clientX-S.view.x)/S.view.z,y:(e.clientY-S.view.y)/S.view.z});

/* ================= блоки ================= */
const getBlock=id=>S.blocks.find(b=>b.id===id);
const plBlock=()=>S.blocks.find(b=>b.type==='pl');

function albumHTML(b){
  const n=b.tracks.filter(t=>t.on).length;
  return `<div class="in"><div class="bh"><div class="ti"><b>${esc(b.title)}</b><span>${esc(b.artist)} · ${b.tracks.length} тр.</span></div>
<button class="ib" data-a="col" title="Свернуть / развернуть">${b.col?'▸':'▾'}</button><button class="ib" data-a="close" title="Убрать">✕</button></div>
<div class="ab"><div class="ar"><button class="btn pri" data-a="add">＋ В плейлист (<span class="cnt">${n}</span>)</button><button class="lnk" data-a="all">все</button><button class="lnk" data-a="none">никакие</button></div>
<ul class="tl scroll">${b.tracks.map((t,i)=>`<li><label><input type="checkbox" data-i="${i}" ${t.on?'checked':''}><span class="n">${i+1}</span><span class="tt${t.on?'':' off'}">${esc(t.t)}</span><span class="d">${fmtDur(t.d)}</span></label></li>`).join('')}</ul></div></div><div class="rs">↘</div>`;
}
function plHTML(){
  return `<div class="in"><div class="bh"><input class="nm" value="${esc(S.pl.name)}" maxlength="60" aria-label="Название плейлиста"><button class="ib hl" data-a="back" title="Вернуть прежний порядок" style="display:none">↩</button><button class="ib" data-a="shuf" title="Перемешать">🔀</button></div>
<ul class="pl scroll"></ul>
<div class="pf"><button class="btn" data-a="fmt"></button><button class="btn pri" data-a="copy">Копировать</button><button class="btn" data-a="dl">.txt</button><button class="btn danger" data-a="clr">Очистить</button></div></div><div class="rs">↘</div>`;
}
function coverHTML(b){
  return `<div class="in"><img src="${esc(b.art)}" alt="" draggable="false" referrerpolicy="no-referrer"></div><div class="rot">↻</div><div class="rs">↘</div><div class="cx" data-a="close">✕</div>`;
}
const inner=b=>b.type==='album'?albumHTML(b):b.type==='pl'?plHTML():coverHTML(b);

function place(b){
  const el=els.get(b.id);if(!el)return;
  el.style.left=b.x+'px';el.style.top=b.y+'px';el.style.width=b.w+'px';
  el.style.height=((b.type==='album'&&b.col)?COLH:b.h)+'px';
  el.style.zIndex=b.z||1;
  el.style.transform=b.rot?`rotate(${b.rot}deg)`:'';
  el.classList.toggle('col',!!b.col);
}
function mount(b){
  const el=document.createElement('div');
  el.className='blk '+b.type;el.dataset.id=b.id;el.innerHTML=inner(b);
  world.appendChild(el);els.set(b.id,el);place(b);
  if(b.type==='pl')renderPl();
  return el;
}
function refresh(b){
  const el=els.get(b.id);if(!el)return;
  const sc=$('.scroll',el),top=sc?sc.scrollTop:0;
  el.innerHTML=inner(b);
  const sc2=$('.scroll',el);if(sc2)sc2.scrollTop=top;
  place(b);
}
function select(id){S.sel=id;for(const [bid,el] of els)el.classList.toggle('sel',bid===id);}
function bring(b){b.z=++S.zc;place(b);}
function removeBlock(b){S.blocks=S.blocks.filter(x=>x!==b);const el=els.get(b.id);if(el)el.remove();els.delete(b.id);if(S.sel===b.id)S.sel=null;saveSoon();}

/* ближайшее к центру экрана свободное место под группу блоков */
function findSpot(w,h){
  const v=S.view,z=v.z,gap=24;
  const cx=(vp.clientWidth/2-v.x)/z-w/2,cy=(vp.clientHeight/2-v.y)/z-h/2;
  const hit=(x,y)=>S.blocks.some(b=>x<b.x+b.w+gap&&x+w>b.x-gap&&y<b.y+b.h+gap&&y+h>b.y-gap);
  let best=null,bd=Infinity;
  for(let y=20;y<=WH-h-20;y+=40)for(let x=20;x<=WW-w-20;x+=40){
    if(hit(x,y))continue;
    const d=(x-cx)*(x-cx)+(y-cy)*(y-cy);if(d<bd){bd=d;best={x,y};}
  }
  return best||{x:clamp(cx,20,WW-w-20),y:clamp(cy,20,WH-h-20)};
}
/* сдвигает вид так, чтобы прямоугольник был виден (масштаб не меняется) */
function reveal(x,y,w,h){
  const v=S.view,z=v.z,W=vp.clientWidth,H=vp.clientHeight;
  const L=x*z+v.x,T=y*z+v.y,R=(x+w)*z+v.x,B=(y+h)*z+v.y,m=16,top=72,bot=84;
  if(L<m||R>W-m)v.x=(R-L>W-2*m)?m-x*z:v.x+(L<m?m-L:(W-m)-R);
  if(T<top||B>H-bot)v.y=(B-T>H-top-bot)?top-y*z:v.y+(T<top?top-T:(H-bot)-B);
  clampView();applyView();
}
function addAlbum(a,tracks){
  const w=330,h=440,gw=w+20+260,sp=findSpot(gw,h);
  const alb={id:uid(),type:'album',x:sp.x,y:sp.y,w,h,z:++S.zc,title:a.title,artist:a.artist,art:a.art,thumb:a.thumb,tracks,col:false};
  const cov={id:uid(),type:'cover',x:sp.x+w+20,y:sp.y,w:260,h:260,rot:0,z:++S.zc,art:a.art,title:a.title};
  S.blocks.push(alb,cov);mount(alb);mount(cov);select(alb.id);
  reveal(sp.x,sp.y,w,h);saveSoon();
}

/* ================= плейлист ================= */
function renderPl(){
  const b=plBlock();if(!b)return;const el=els.get(b.id);if(!el)return;
  const ul=$('.pl',el),tr=S.pl.tracks;

  const f=FM.find(x=>x[0]===S.pl.fmt)||FM[0];
  $('[data-a=fmt]',el).textContent=f[1];
  $('[data-a=copy]',el).textContent='Копировать'+(tr.length?` (${tr.length})`:'');
  $('[data-a=back]',el).style.display=S.backup?'':'none';
}
function addTracks(list){
  const have=new Set(S.pl.tracks.map(t=>norm(t.artist+' '+t.title)));let n=0;
  for(const t of list){
    const key=norm((t.artist||'')+' '+t.title);if(!t.title||have.has(key))continue;
    have.add(key);S.pl.tracks.push({id:uid(),artist:t.artist||'',title:t.title,art:t.art||''});n++;
  }
  S.backup=null;renderPl();saveSoon();
  const b=plBlock(),el=b&&els.get(b.id);if(el&&n){const ul=$('.pl',el);ul.scrollTop=ul.scrollHeight;}
  return n;
}
function exportText(){
  const f=S.pl.fmt;
  return S.pl.tracks.map(t=>f==='t'||!t.artist?t.title:f==='ta'?`${t.title} - ${t.artist}`:`${t.artist} - ${t.title}`).join('\n');
}
function shuffle(){
  const tr=S.pl.tracks;if(tr.length<2)return toast('Мало треков для перемешивания');
  S.backup=tr.map(t=>t.id);
  for(let i=tr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[tr[i],tr[j]]=[tr[j],tr[i]];}
  renderPl();saveSoon();toast('Перемешано');
}
function unshuffle(){
  if(!S.backup)return;
  const map=new Map(S.pl.tracks.map(t=>[t.id,t])),seen=new Set();
  const out=[];for(const id of S.backup){const t=map.get(id);if(t){out.push(t);seen.add(id);}}
  for(const t of S.pl.tracks)if(!seen.has(t.id))out.push(t);
  S.pl.tracks=out;S.backup=null;renderPl();saveSoon();toast('Порядок возвращён');
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true;}
  catch(e){
    const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();return ok;
  }
}
function download(){
  const t=exportText();if(!t)return toast('Плейлист пуст');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));
  a.download=(S.pl.name||'playlist').replace(/[\\/:*?"<>|]/g,'_')+'.txt';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function armed(btn,fn,label){
  if(btn._arm){clearTimeout(btn._arm);btn._arm=0;btn.classList.remove('armed');if(btn._txt!=null){btn.textContent=btn._txt;btn._txt=null;}fn();return;}
  btn.classList.add('armed');if(label){btn._txt=btn.textContent;btn.textContent=label;}
  btn._arm=setTimeout(()=>{btn._arm=0;btn.classList.remove('armed');if(btn._txt!=null){btn.textContent=btn._txt;btn._txt=null;}},2500);

}

  else if(a==='add'){
    const list=b.tracks.filter(t=>t.on).map(t=>({artist:t.a||b.artist,title:t.t,art:b.thumb}));

  }
  else if(a==='all'||a==='none'){b.tracks.forEach(t=>t.on=(a==='all'));syncAlbum(b);saveSoon();}
  else if(a==='shuf')shuffle();
  else if(a==='back')unshuffle();
  else if(a==='fmt'){const i=FM.findIndex(x=>x[0]===S.pl.fmt);S.pl.fmt=FM[(i+1)%FM.length][0];renderPl();saveSoon();}
  else if(a==='copy'){const t=exportText();if(!t)return toast('Плейлист пуст');copyText(t).then(ok=>toast(ok?'Скопировано':'Не вышло скопировать, используй .txt'));}
  else if(a==='dl')download();

function startPinch(){
  if(drag&&drag.type==='draw'&&cur){S.strokes.pop();redraw();cur=null;}
  const [a,b]=[...pointers.values()];
  drag={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,v:Object.assign({},S.view)};
}
vp.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});},true);
vp.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(document.activeElement===q)q.blur();
  closeDD();
  if(pointers.size>=2){if(drag&&(drag.type==='pan'||drag.type==='draw'))startPinch();return;}
  if(S.tool!=='hand'){
    const p=toWorld(e);
    cur={c:S.color,w:S.tool==='eraser'?S.size*2.5:S.size,e:S.tool==='eraser',p:[[Math.round(p.x),Math.round(p.y)]]};
    S.strokes.push(cur);dot(cur);drag={type:'draw',id:e.pointerId};return;
  }
  const t=e.target,blkEl=t.closest&&t.closest('.blk');
  if(!blkEl){select(null);drag={type:'pan',id:e.pointerId,sx:e.clientX,sy:e.clientY,vx:S.view.x,vy:S.view.y};return;}
  const b=getBlock(blkEl.dataset.id);if(!b)return;
  select(b.id);bring(b);
  const base={id:e.pointerId,b,sx:e.clientX,sy:e.clientY,x:b.x,y:b.y,w:b.w,h:b.h};
  if(t.closest('.rs')){drag=Object.assign({type:'resize'},base);return;}
  if(t.closest('.rot')){drag=Object.assign({type:'rotate'},base);return;}
  if(t.closest('.grip')){const li=t.closest('li');li.classList.add('drag');drag={type:'reorder',id:e.pointerId,li,ul:li.parentNode};return;}
  if(t.closest('button,input,a,label,.scroll,.cx,[data-a]'))return;
  if(t.closest('.bh')||b.type==='cover')drag=Object.assign({type:'move'},base);
});
window.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!drag)return;
  const v=S.view;
  if(drag.type==='pinch'){
    if(pointers.size<2)return;
    const [a,b]=[...pointers.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const z=clamp(drag.v.z*d/drag.d0,.25,2.5);
    const wx=(drag.mx-drag.v.x)/drag.v.z,wy=(drag.my-drag.v.y)/drag.v.z;
    v.z=z;v.x=mx-wx*z;v.y=my-wy*z;clampView();applyView();return;
  }
  if(drag.id!==e.pointerId)return;
  if(drag.type==='pan'){v.x=drag.vx+(e.clientX-drag.sx);v.y=drag.vy+(e.clientY-drag.sy);clampView();applyView();}
  else if(drag.type==='draw'){
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];
    for(const ev of (evs.length?evs:[e])){
      const p=toWorld(ev),last=cur.p[cur.p.length-1],x=Math.round(p.x),y=Math.round(p.y);
      if(Math.abs(x-last[0])+Math.abs(y-last[1])<2)continue;
      cur.p.push([x,y]);seg(cur,cur.p.length-1);
    }
  }
  else if(drag.type==='move'){
    const b=drag.b;b.x=clamp(drag.x+(e.clientX-drag.sx)/v.z,-200,WW-40);b.y=clamp(drag.y+(e.clientY-drag.sy)/v.z,-100,WH-40);place(b);
  }
  else if(drag.type==='resize'){
    const b=drag.b,dx=(e.clientX-drag.sx)/v.z,dy=(e.clientY-drag.sy)/v.z;
    const a=(b.rot||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
    const lx=dx*c+dy*s,ly=-dx*s+dy*c;
    let w,h;
    if(b.type==='cover'){w=h=Math.max(60,drag.w+(lx+ly)/2);}
    else{w=Math.max(240,drag.w+lx);h=Math.max(b.type==='album'?220:180,drag.h+ly);}
    const dw=w-drag.w,dh=h-drag.h,cx=drag.x+drag.w/2,cy=drag.y+drag.h/2;
    const ncx=cx+(dw/2)*c-(dh/2)*s,ncy=cy+(dw/2)*s+(dh/2)*c;
    b.w=w;b.h=h;b.x=ncx-w/2;b.y=ncy-h/2;place(b);
  }
  else if(drag.type==='rotate'){
    const b=drag.b,r=els.get(b.id).getBoundingClientRect();
    let ang=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI+90;
    ang=((ang+180)%360+360)%360-180;
    const snap=Math.round(ang/15)*15;if(Math.abs(ang-snap)<3)ang=snap;
    b.rot=Math.round(ang*10)/10;place(b);
  }
  else if(drag.type==='reorder'){
    const rect=drag.ul.getBoundingClientRect();
    if(e.clientY<rect.top+28)drag.ul.scrollTop-=10;else if(e.clientY>rect.bottom-28)drag.ul.scrollTop+=10;
    let ref=null;
    for(const r of drag.ul.children){
      if(r===drag.li||!r.dataset.id)continue;
      const rc=r.getBoundingClientRect();if(e.clientY<rc.top+rc.height/2){ref=r;break;}
    }
    if(ref!==drag.li.nextSibling)drag.ul.insertBefore(drag.li,ref);
  }
});
function endPointer(e){

  if(drag.id!==e.pointerId)return;

}

function dot(s){ctx.save();ctx.globalCompositeOperation=s.e?'destination-out':'source-over';ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.p[0][0],s.p[0][1],s.w/2,0,Math.PI*2);ctx.fill();ctx.restore();}
function seg(s,i){ctx.save();ctx.globalCompositeOperation=s.e?'destination-out':'source-over';ctx.strokeStyle=s.c;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(s.p[i-1][0],s.p[i-1][1]);ctx.lineTo(s.p[i][0],s.p[i][1]);ctx.stroke();ctx.restore();}
function redraw(){ctx.clearRect(0,0,WW,WH);for(const s of S.strokes){if(!s.p||!s.p.length)continue;dot(s);for(let i=1;i<s.p.length;i++)seg(s,i);}}

/* ================= поиск ================= */
function jsonp(build,ms=9000){
  return new Promise((res,rej)=>{
    const cb='__cb'+uid(),s=document.createElement('script');let done=false;
    const fin=()=>{if(done)return;done=true;clearTimeout(t);try{delete window[cb];}catch(_){window[cb]=undefined;}s.remove();};
    const t=setTimeout(()=>{fin();rej(new Error('таймаут'));},ms);
    window[cb]=d=>{fin();res(d);};
    s.onerror=()=>{fin();rej(new Error('сеть недоступна или заблокирована'));};
    s.src=build(cb);document.head.appendChild(s);
  });
}
async function fetchJ(url,ms=7000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
  finally{clearTimeout(t);}
}
const itJ=url=>fetchJ(url).catch(()=>jsonp(cb=>url+'&callback='+cb));
const dzJ=url=>jsonp(cb=>url+(url.includes('?')?'&':'?')+'output=jsonp&callback='+cb);
const big=u=>u?u.replace(/\/\d+x\d+bb\./,'/600x600bb.'):'';

const PROV={
  itunes:{
    name:'iTunes',
    async search(qs){
      const cc=/[\u0400-\u04FF]/.test(qs)?'ru':'us';
      const base=`https://itunes.apple.com/search?term=${encodeURIComponent(qs)}&country=${cc}&limit=15`;
      const [a,s]=await Promise.all([itJ(base+'&entity=album'),itJ(base+'&entity=song')]);
      return{
        albums:(a.results||[]).filter(x=>x.collectionId).map(x=>({prov:'itunes',id:x.collectionId,cc,title:x.collectionName,artist:x.artistName,art:big(x.artworkUrl100),thumb:x.artworkUrl100,year:(x.releaseDate||'').slice(0,4),n:x.trackCount})),
        songs:(s.results||[]).filter(x=>x.trackId).map(x=>({prov:'itunes',id:x.trackId,title:x.trackName,artist:x.artistName,album:x.collectionName,thumb:x.artworkUrl100,art:big(x.artworkUrl100)}))
      };
    },
    async tracks(a){
      const d=await itJ(`https://itunes.apple.com/lookup?id=${a.id}&entity=song&limit=200&country=${a.cc}`);
      return(d.results||[]).filter(x=>x.wrapperType==='track'&&x.trackName)
        .sort((p,r)=>(p.discNumber||1)-(r.discNumber||1)||(p.trackNumber||0)-(r.trackNumber||0))
        .map(x=>({t:x.trackName,a:x.artistName,d:Math.round((x.trackTimeMillis||0)/1000),on:true}));
    }
  },
  deezer:{
    name:'Deezer',
    async search(qs){
      const e=encodeURIComponent(qs);
      const [a,s]=await Promise.all([dzJ(`https://api.deezer.com/search/album?q=${e}&limit=15`),dzJ(`https://api.deezer.com/search/track?q=${e}&limit=15`)]);
      if(a&&a.error)throw new Error(a.error.message||'ошибка Deezer');
      return{
        albums:(a.data||[]).map(x=>({prov:'deezer',id:x.id,title:x.title,artist:x.artist&&x.artist.name,art:x.cover_xl||x.cover_big,thumb:x.cover_medium||x.cover_small,year:'',n:x.nb_tracks})),
        songs:(s.data||[]).map(x=>({prov:'deezer',id:x.id,title:x.title,artist:x.artist&&x.artist.name,album:x.album&&x.album.title,thumb:x.album&&(x.album.cover_medium||x.album.cover_small),art:x.album&&(x.album.cover_xl||x.album.cover_big)}))
      };
    },
    async tracks(a){
      const d=await dzJ(`https://api.deezer.com/album/${a.id}/tracks?limit=200`);
      if(d&&d.error)throw new Error(d.error.message||'ошибка Deezer');
      return(d.data||[]).map(x=>({t:x.title,a:x.artist&&x.artist.name,d:x.duration||0,on:true}));
    }
  }
};
const ALL=[PROV.itunes,PROV.deezer];

const uniq=arr=>{const m=new Map();for(const x of arr){const k=x.prov+':'+x.id;if(!m.has(k))m.set(k,x);}return[...m.values()];};
function rankItems(items,toks,txt){
  const sc=it=>{const h=' '+norm(txt(it));let s=0;for(const t of toks){if(h.includes(' '+t))s+=2;else if(h.includes(t))s+=1;}return s;};
  const w=items.map((it,i)=>({it,s:sc(it),i}));
  const pos=w.filter(x=>x.s>0);
  return(pos.length?pos:w).sort((a,b)=>b.s-a.s||a.i-b.i).map(x=>x.it);
}
async function smartSearch(text){
  const raw=text.trim().replace(/\s+/g,' '),ws=raw.split(' '),toks=norm(raw).split(' ').filter(Boolean);
  const att=[raw];
  if(ws.length>1)att.push(ws.slice(0,-1).join(' '));
  if(ws.length>2)att.push(ws.slice(0,2).join(' '));
  const errs=[];let anyOk=false;
  for(const p of order()){
    try{
      const rs=await Promise.allSettled(att.map(a=>p.search(a)));
      const ok=rs.filter(r=>r.status==='fulfilled').map(r=>r.value);
      if(!ok.length)throw rs[0].reason;
      anyOk=true;
      const albums=rankItems(uniq(ok.flatMap(x=>x.albums)),toks,a=>a.artist+' '+a.title).slice(0,8);
      const songs=rankItems(uniq(ok.flatMap(x=>x.songs)),toks,s=>s.artist+' '+s.title+' '+(s.album||'')).slice(0,10);
      if(albums.length||songs.length){lastGood=p;return{albums,songs,src:p.name};}
    }catch(e){errs.push(p.name+': '+((e&&e.message)||e));}
  }
  if(!anyOk){const er=new Error('net');er.details=errs;throw er;}
  return{albums:[],songs:[],src:null};
}

let R={albums:[],songs:[],src:null,has:false},rid=0,tm;
const closeDD=()=>{dd.hidden=true;};
function manualRow(){
  const v=q.value.trim();if(!v)return'';
  return`<div class="sec">Вручную</div><div class="r" data-k="m"><div class="ph">✎</div><div class="t"><b>${esc(v)}</b><span>Добавить в плейлист текстом (Artist - Title)</span></div><div class="go">＋</div></div>`;
}
function renderDD(){
  let h='';
  const row=(k,i,x,sub)=>`<div class="r" data-k="${k}" data-i="${i}">${x.thumb?`<img src="${esc(x.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:'<div class="ph">♪</div>'}<div class="t"><b>${esc(x.title)}</b><span>${esc(sub)}</span></div><div class="go">＋</div></div>`;
  if(R.albums.length)h+='<div class="sec">Альбомы</div>'+R.albums.map((a,i)=>row('a',i,a,`${a.artist||''}${a.year?' · '+a.year:''}${a.n?' · '+a.n+' тр.':''}`)).join('');
  if(R.songs.length)h+='<div class="sec">Песни</div>'+R.songs.map((s,i)=>row('s',i,s,`${s.artist||''}${s.album?' · '+s.album:''}`)).join('');
  if(!R.albums.length&&!R.songs.length)h+='<div class="msg">Ничего не нашлось. Попробуй другое написание или добавь вручную.</div>';
  h+=manualRow();
  if(R.src)h+=`<div class="msg"><small>Источник: ${esc(R.src)}</small></div>`;
  dd.innerHTML=h;dd.hidden=false;
}
function renderErr(err){
  const det=(err&&err.details||[String(err&&err.message||err)]).join(' · ');
  dd.innerHTML=`<div class="msg err">Не удалось связаться с музыкальными каталогами.<small>Если файл открыт внутри приложения Claude или другого встроенного просмотрщика, открой его в обычном браузере (Chrome): там интернет-запросы не блокируются. Ещё может мешать VPN или блокировка сети.</small><small>Подробности: ${esc(det)}</small></div>`+manualRow();
  dd.hidden=false;
}
async function doSearch(v){
  if(v.length<2)return;
  const id=++rid;dd.innerHTML='<div class="msg">Ищу…</div>'+manualRow();dd.hidden=false;
  try{const res=await smartSearch(v);if(id!==rid)return;R=Object.assign(res,{has:true});renderDD();}
  catch(err){if(id!==rid)return;renderErr(err);}
}
q.addEventListener('input',()=>{clearTimeout(tm);const v=q.value.trim();if(v.length<2){rid++;closeDD();return;}tm=setTimeout(()=>doSearch(v),350);});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(tm);doSearch(q.value.trim());}if(e.key==='Escape')closeDD();});
q.addEventListener('focus',()=>{if(q.value.trim().length>=2&&R.has&&dd.hidden)renderDD();});
$('#qx').addEventListener('click',()=>{q.value='';rid++;closeDD();q.focus();});

const busy=new Set();
dd.addEventListener('click',async e=>{
  const r=e.target.closest('.r');if(!r)return;
  const k=r.dataset.k;
  if(k==='m'){
    const v=q.value.trim(),m=v.split(/\s+[-–—]\s+/);
    const n=addTracks([{artist:m.length>1?m[0]:'',title:m.length>1?m.slice(1).join(' - '):v}]);
    return toast(n?'Добавлено текстом':'Уже в плейлисте');
  }
  if(k==='s'){
    const s=R.songs[+r.dataset.i];
    const n=addTracks([{artist:s.artist,title:s.title,art:s.thumb}]);
    return toast(n?`Добавлено: ${s.title}`:'Уже в плейлисте');
  }
  if(k==='a'){
    const a=R.albums[+r.dataset.i],key=a.prov+':'+a.id;if(busy.has(key))return;
    busy.add(key);toast('Загружаю треклист…');
    try{
      const tracks=await PROV[a.prov].tracks(a);
      if(!tracks.length)throw new Error('пустой треклист');
      addAlbum(a,tracks);closeDD();toast('Альбом добавлен на поле');
    }catch(err){toast('Не удалось загрузить треклист');}
    finally{busy.delete(key);}
  }
});

let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
